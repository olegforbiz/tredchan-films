<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тредчани кіно — національний перелік</title>
<meta name="description" content="Національний перелік улюблених фільмів і серіалів тредчан. Пропонуй своє кіно з коментарем.">
<style>
:root{--bg:#000;--card:#0a0a0a;--text:#f2f2f2;--text2:#8a8a8a;--border:#262626;--gold:#e0b64a;}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
a{color:inherit;}
.app{max-width:620px;margin:0 auto;border-left:1px solid var(--border);border-right:1px solid var(--border);min-height:100vh;}
.topbar{position:sticky;top:0;background:rgba(0,0,0,0.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);padding:16px;text-align:center;z-index:10;}
.topbar h1{margin:0;font-size:18px;font-weight:700;}
.topbar p{margin:4px 0 0;font-size:12px;color:var(--text2);}
.composer{display:flex;gap:12px;padding:16px;border-bottom:1px solid var(--border);align-items:center;}
.avatar{width:40px;height:40px;border-radius:50%;background:#2c2c2c;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex-shrink:0;overflow:hidden;}
.avatar img{width:100%;height:100%;object-fit:cover;display:block;}
.composer-body{flex:1;}
.composer-prompt{margin:0 0 10px;color:var(--text2);font-size:15px;}
.btn-propose{display:inline-block;background:#fff;color:#000;font-weight:600;font-size:14px;padding:9px 18px;border-radius:20px;text-decoration:none;}
.tabs{display:flex;border-bottom:1px solid var(--border);}
.tab{flex:1;background:none;border:none;color:var(--text2);padding:14px;font-size:14px;font-weight:600;cursor:pointer;border-bottom:2px solid transparent;font-family:inherit;}
.tab.active{color:var(--text);border-bottom-color:var(--text);}
.feed{display:block;}
.post{display:flex;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border);}
.post-main{flex:1;min-width:0;}
.post-head{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;}
.handle{font-weight:600;font-size:14px;}
.meta{color:var(--text2);font-size:12px;}
.tag{font-size:10px;background:#1c1c1c;color:#9a9a9a;padding:2px 8px;border-radius:10px;margin-left:auto;white-space:nowrap;}
.post-body{margin:4px 0 8px;font-size:14px;line-height:1.45;color:var(--text2);white-space:pre-wrap;overflow-wrap:anywhere;}
.movie-card{display:flex;gap:10px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:8px;margin-top:2px;text-decoration:none;}
.poster{width:52px;height:76px;border-radius:6px;background:#1c1c1c;flex-shrink:0;object-fit:cover;display:flex;align-items:center;justify-content:center;font-size:10px;color:#555;}
.movie-info{flex:1;min-width:0;}
.movie-title{font-weight:600;font-size:14px;margin:0;color:var(--text);}
.movie-rating{font-size:12px;color:var(--gold);margin-top:3px;}
.movie-cast{font-size:11px;color:var(--text2);margin-top:2px;}
.actions{display:flex;gap:22px;margin-top:10px;color:var(--text2);}
.actions svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;display:block;}
.empty-state{padding:28px 16px;text-align:center;color:var(--text2);font-size:13px;line-height:1.6;}
.footer{padding:20px 16px;text-align:center;font-size:12px;color:var(--text2);}
.footer a{text-decoration:underline;}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <h1>Тредчани кіно</h1>
    <p>Національний перелік улюблених фільмів і серіалів</p>
  </header>
  <main>
    <section class="composer">
      <div class="avatar">OF</div>
      <div class="composer-body">
        <p class="composer-prompt">Яке твоє улюблене кіно і чому?</p>
        <a id="proposeBtn" class="btn-propose" href="#" target="_blank" rel="noopener">Запропонувати фільм</a>
      </div>
    </section>
    <div class="tabs">
      <button class="tab active" data-tab="official">Рейтинг тредчана</button>
      <button class="tab" data-tab="community">Пропозиції спільноти</button>
    </div>
    <section id="feed-official" class="feed"></section>
    <section id="feed-community" class="feed" style="display:none">
      <p class="empty-state">Завантажую пропозиції з GitHub…</p>
    </section>
  </main>
  <div class="footer">
    Список веде <a href="https://github.com/olegforbiz" target="_blank" rel="noopener">@olegforbiz</a> ·
    <a id="repoLink" href="#" target="_blank" rel="noopener">сирці на GitHub</a> ·
    афіші через iTunes Search API
  </div>
</div>
<script>
const REPO = "olegforbiz/tredchan-films";
document.getElementById("repoLink").href = "https://github.com/" + REPO;

const SEED = [
{t:"Breaking Bad",y:"2008",type:"серіал",rating:9.5,cat:"Рекомендація",cast:"Bryan Cranston, Aaron Paul, Anna Gunn",syn:"Вчитель хімії дізнається про невиліковний рак і починає варити метамфетамін, щоб забезпечити родину. Страх бідності й смерті поступово перетворює тиху людину на найнебезпечнішого злочинця міста.",wiki:"Breaking_Bad"},
{t:"The Sopranos",y:"1999",type:"серіал",rating:9.2,cat:"Рекомендація",cast:"James Gandolfini, Edie Falco, Lorraine Bracco",syn:"Бос мафії з Нью-Джерсі починає ходити до психотерапевта через панічні атаки. Керівництво кримінальним бізнесом і розбір травм дитинства йдуть паралельно.",wiki:"The_Sopranos"},
{t:"Better Call Saul",y:"2015",type:"серіал",rating:8.9,cat:"Рекомендація",cast:"Bob Odenkirk, Rhea Seehorn, Jonathan Banks",syn:"Приквел до Breaking Bad про адвоката, який усе життя в тіні успішного брата. Відчуття несправедливості й амбіція штовхають його до афер на межі закону.",wiki:"Better_Call_Saul"},
{t:"Succession",y:"2018",type:"серіал",rating:8.8,cat:"Рекомендація",cast:"Brian Cox, Jeremy Strong, Sarah Snook",syn:"Старіючий магнат медіаімперії не може обрати спадкоємця серед власних дітей. Діти воюють за трон і водночас за батьківське визнання, якого ніколи не отримували.",wiki:"Succession_(TV_series)"},
{t:"Peaky Blinders",y:"2013",type:"серіал",rating:8.8,cat:"Рекомендація",cast:"Cillian Murphy, Paul Anderson, Sophie Rundle",syn:"Ветеран Першої світової з ПТСР перетворює вуличну банду Бірмінгема на легальну бізнес-імперію. Травма війни живить його холодний розрахунок і водночас руйнує особисте життя.",wiki:"Peaky_Blinders"},
{t:"Inception",y:"2010",type:"фільм",rating:8.8,cat:"Нолан (раніше виключено)",cast:"Leonardo DiCaprio, Joseph Gordon-Levitt, Elliot Page",syn:"Злодій, що краде ідеї уві сні, отримує шанс повернутися додому в обмін на імплантацію чужої думки. Провина за смерть дружини переслідує його на кожному рівні сну.",wiki:"Inception"},
{t:"Interstellar",y:"2014",type:"фільм",rating:8.7,cat:"Вже знаєш",cast:"Matthew McConaughey, Anne Hathaway, Jessica Chastain",syn:"Фермер-пілот залишає доньку заради польоту крізь червоточину в пошуках нового дому для людства.",wiki:"Interstellar_(film)"},
{t:"Se7en",y:"1995",type:"фільм",rating:8.6,cat:"Бред Пітт (раніше виключено)",cast:"Brad Pitt, Morgan Freeman, Kevin Spacey",syn:"Два детективи ганяються за вбивцею, який карає жертв за сімома смертними гріхами. Молодий напарник поступово втрачає психологічну стійкість перед фіналом.",wiki:"Se7en"},
{t:"Whiplash",y:"2014",type:"фільм",rating:8.5,cat:"Рекомендація",cast:"Miles Teller, J.K. Simmons",syn:"Молодий барабанщик потрапляє під крило викладача-тирана, що ламає учнів заради ідеї величі. Межа між тренуванням таланту й психологічним катуванням стирається.",wiki:"Whiplash_(film)"},
{t:"Mr. Robot",y:"2015",type:"серіал",rating:8.5,cat:"Рекомендація",cast:"Rami Malek, Christian Slater, Carly Chaikin",syn:"Хакер із соціальною тривожністю і дисоціативним розладом приєднується до групи, що хоче знищити світову корпорацію боргів. Межа між реальністю і його психікою розмивається.",wiki:"Mr._Robot"},
{t:"The Usual Suspects",y:"1995",type:"фільм",rating:8.5,cat:"Рекомендація",cast:"Kevin Spacey, Gabriel Byrne, Benicio del Toro",syn:"П'ятеро злочинців після пограбування опиняються втягнутими в план міфічного злочинного генія. Психологічна гра з глядачем, з фіналом-твістом.",wiki:"The_Usual_Suspects"},

{t:"The Prestige",y:"2006",type:"фільм",rating:8.5,cat:"Нолан (раніше виключено)",cast:"Christian Bale, Hugh Jackman, Scarlett Johansson",syn:"Двоє фокусників-суперників доводять професійну ревність до одержимості й саморуйнування. Кожен приносить у жертву особисте життя заради ідеального трюку.",wiki:"The_Prestige_(film)"},
{t:"Ozark",y:"2017",type:"серіал",rating:8.4,cat:"Рекомендація",cast:"Jason Bateman, Laura Linney, Julia Garner",syn:"Фінансовий консультант змушений відмивати гроші картелю, щоб врятувати родину. Сімейний бізнес на межі закону поступово руйнує шлюб і психіку кожного.",wiki:"Ozark_(TV_series)"},
{t:"Memento",y:"2000",type:"фільм",rating:8.4,cat:"Нолан (раніше виключено)",cast:"Guy Pearce, Carrie-Anne Moss",syn:"Чоловік без короткочасної пам'яті розслідує вбивство дружини за допомогою нотаток і татуювань. Розповідь іде у зворотному порядку, повторюючи хаос його психіки.",wiki:"Memento_(film)"},

{t:"Oppenheimer",y:"2023",type:"фільм",rating:8.3,cat:"Нолан (раніше виключено)",cast:"Cillian Murphy, Emily Blunt, Robert Downey Jr.",syn:"Батько атомної бомби переживає провину і політичне переслідування після Другої світової. Наукова амбіція і моральна травма ведуть до самознищення репутації.",wiki:"Oppenheimer_(film)"},
{t:"The Wolf of Wall Street",y:"2013",type:"фільм",rating:8.2,cat:"Рекомендація",cast:"Leonardo DiCaprio, Jonah Hill, Margot Robbie",syn:"Молодий брокер будує імперію шахрайства на Волл-стріт і тоне в наркотиках та розкоші. Бізнес-хист і психологічна залежність від адреналіну ведуть до краху.",wiki:"The_Wolf_of_Wall_Street_(2013_film)"},
{t:"A Beautiful Mind",y:"2001",type:"фільм",rating:8.2,cat:"Рекомендація",cast:"Russell Crowe, Jennifer Connelly",syn:"Геніальний математик розробляє теорію ігор, водночас борючись із шизофренією. Наукове визнання приходить лише після прийняття власної хвороби.",wiki:"A_Beautiful_Mind_(film)"},
{t:"Shutter Island",y:"2010",type:"фільм",rating:8.2,cat:"Рекомендація",cast:"Leonardo DiCaprio, Mark Ruffalo, Ben Kingsley",syn:"Маршал розслідує зникнення пацієнтки психлікарні на острові та занурюється у власну травму. Реальність і галюцинація зливаються до фінального одкровення.",wiki:"Shutter_Island_(film)"},
{t:"Lock, Stock and Two Smoking Barrels",y:"1998",type:"фільм",rating:8.2,cat:"Гай Річі (раніше виключено)",cast:"Jason Flemyng, Dexter Fletcher, Nick Moran",syn:"Четверо друзів програють величезну суму в шахрайській грі в карти й мусять роздобути гроші за тиждень. Дебютний фільм Гая Річі.",wiki:"Lock,_Stock_and_Two_Smoking_Barrels"},
{t:"Catch Me If You Can",y:"2002",type:"фільм",rating:8.1,cat:"Рекомендація",cast:"Leonardo DiCaprio, Tom Hanks, Christopher Walken",syn:"Підліток після розлучення батьків стає одним з найзухваліших аферистів в історії США. Травма родинного розпаду штовхає його будувати фальшиві особистості й статки.",wiki:"Catch_Me_If_You_Can"},
{t:"Gone Girl",y:"2014",type:"фільм",rating:8.1,cat:"Рекомендація",cast:"Ben Affleck, Rosamund Pike",syn:"Зникнення дружини перетворює чоловіка на головного підозрюваного в очах медіа. Психологічна маніпуляція розкриває, наскільки погано подружжя насправді знало одне одного.",wiki:"Gone_Girl_(film)"},

{t:"Marriage Story",y:"2019",type:"фільм",rating:8.0,cat:"Рекомендація",cast:"Adam Driver, Scarlett Johansson",syn:"Пара режисера й акторки проходить через розлучення, що оголює всі невисловлені образи шлюбу. Мелодрама без лиходіїв — лише двоє людей і біль зростання нарізно.",wiki:"Marriage_Story"},

{t:"The Dropout",y:"2022",type:"серіал",rating:7.5,cat:"Рекомендація",cast:"Amanda Seyfried, Naveen Andrews",syn:"Elizabeth Holmes кидає Стенфорд заради стартапу Theranos, що обіцяв революцію в аналізах крові. Амбіція довести собі й батькам власну геніальність доводить її до масштабної афери.",wiki:"The_Dropout_(TV_series)"},

function timeAgo(dateStr){
  const diff = (Date.now() - new Date(dateStr).getTime())/1000;
  const units = [[31536000,"р."],[2592000,"міс."],[86400,"дн."],[3600,"год."],[60,"хв."]];
  for(const [s,l] of units){ if(diff>=s){ return Math.floor(diff/s)+" "+l+" тому"; } }
  return "щойно";
}

function escapeAttr(s){ return String(s).replace(/"/g,"&quot;"); }

async function fetchPoster(title){
  try{
    const res = await fetch("https://itunes.apple.com/search?term="+encodeURIComponent(title)+"&media=movie&limit=1");
    if(!res.ok) return null;
    const data = await res.json();
    const art = data.results && data.results[0] && data.results[0].artworkUrl100;
    return art ? art.replace("100x100bb","400x400bb") : null;
  }catch(e){ return null; }
}

function iconHeart(){return '<svg viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>';}
function iconComment(){return '<svg viewBox="0 0 24 24"><path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5c-1.3 0-2.5-.3-3.6-.8L3 21l1.8-5.9A8.5 8.5 0 1 1 21 11.5z"/></svg>';}

function buildSeedPost(item){
  const post = document.createElement("div");
  post.className = "post";
  const initials = item.type === "серіал" ? "СЕ" : "ФІ";
  post.innerHTML =
    '<div class="avatar">OF</div>' +
    '<div class="post-main">' +
      '<div class="post-head"><span class="handle">@olegforbiz</span><span class="meta">оригінальний перелік</span><span class="tag">'+item.cat+'</span></div>' +
      '<a class="movie-card" href="https://en.wikipedia.org/wiki/'+item.wiki+'" target="_blank" rel="noopener">' +
        '<div class="poster" data-title="'+escapeAttr(item.t)+'">'+initials+'</div>' +
        '<div class="movie-info">' +
          '<p class="movie-title">'+item.t+' ('+item.y+')</p>' +
          '<p class="movie-rating">★ '+item.rating.toFixed(1)+' · '+item.type+'</p>' +
          '<p class="movie-cast">'+item.cast+'</p>' +
        '</div>' +
      '</a>' +
      '<p class="post-body">'+item.syn+'</p>' +
      '<div class="actions">'+iconHeart()+iconComment()+'</div>' +
    '</div>';
  return post;
}

function buildCommunityPost(issue, title){
  const post = document.createElement("div");
  post.className = "post";
  const login = issue.user && issue.user.login ? issue.user.login : "анонім";
  const avatarUrl = issue.user && issue.user.avatar_url ? issue.user.avatar_url : "";
  const body = (issue.body || "Без коментаря.").slice(0, 600);
  post.innerHTML =
    '<div class="avatar">'+(avatarUrl ? '<img src="'+avatarUrl+'" alt="'+escapeAttr(login)+'">' : login.slice(0,2).toUpperCase())+'</div>' +
    '<div class="post-main">' +
      '<div class="post-head"><span class="handle">@'+login+'</span><span class="meta">'+timeAgo(issue.created_at)+'</span></div>' +
      '<a class="movie-card" href="'+issue.html_url+'" target="_blank" rel="noopener">' +
        '<div class="poster" data-title="'+escapeAttr(title)+'">ФІ</div>' +
        '<div class="movie-info"><p class="movie-title">'+title+'</p><p class="movie-cast">пропозиція тредчана</p></div>' +
      '</a>' +
      '<p class="post-body"></p>' +
      '<div class="actions">'+iconHeart()+iconComment()+'</div>' +
    '</div>';
  post.querySelector(".post-body").textContent = body;
  return post;
}

async function hydratePosters(root){
  const posters = root.querySelectorAll(".poster[data-title]");
  for(const p of posters){
    const title = p.getAttribute("data-title");
    const url = await fetchPoster(title);
    if(url){
      const img = document.createElement("img");
      img.src = url;
      img.alt = title;
      img.style.width = "100%";
      img.style.height = "100%";
      img.style.objectFit = "cover";
      img.style.borderRadius = "6px";
      p.textContent = "";
      p.appendChild(img);
    }
    await new Promise(r=>setTimeout(r,180));
  }
}

function renderOfficial(){
  const el = document.getElementById("feed-official");
  const sorted = SEED.slice().sort((a,b)=>b.rating-a.rating);
  sorted.forEach(item=>el.appendChild(buildSeedPost(item)));
  hydratePosters(el);
}

async function renderCommunity(){
  const el = document.getElementById("feed-community");
  try{
    const res = await fetch("https://api.github.com/repos/"+REPO+"/issues?state=all&per_page=100");
    if(!res.ok) throw new Error("http "+res.status);
    const issues = await res.json();
    const subs = issues.filter(i=>!i.pull_request && i.title.indexOf("[Фільм]")===0);
    el.innerHTML = "";
    if(subs.length===0){
      el.innerHTML = '<p class="empty-state">Поки що пропозицій немає. Стань першим — тисни «Запропонувати фільм» вгорі.</p>';
      return;
    }
    subs.sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
    subs.forEach(issue=>{
      const title = issue.title.replace("[Фільм]","").trim();
      el.appendChild(buildCommunityPost(issue, title));
    });
    hydratePosters(el);
  }catch(e){
    el.innerHTML = '<p class="empty-state">Не вдалось завантажити пропозиції з GitHub. Спробуй відкрити репозиторій напряму.</p>';
  }
}

document.querySelectorAll(".tab").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    document.querySelectorAll(".tab").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    const target = btn.dataset.tab;
    document.getElementById("feed-official").style.display = target==="official" ? "block" : "none";
    document.getElementById("feed-community").style.display = target==="community" ? "block" : "none";
  });
});

const proposeBtn = document.getElementById("proposeBtn");
const issueTitle = encodeURIComponent("[Фільм] Назва фільму");
const issueBody = encodeURIComponent("Мій коментар:\n\nЧому раджу:\n\nМій рейтинг (необов'язково):");
proposeBtn.href = "https://github.com/"+REPO+"/issues/new?title="+issueTitle+"&body="+issueBody;

renderOfficial();
renderCommunity();
</script>
