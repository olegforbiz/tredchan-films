<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тредчани кіно — національний перелік</title>
<meta name="description" content="Національний перелік улюблених фільмів і серіалів тредчан. Пропонуй своє кіно з коментарем.">
<style>
:root{--bg:#000;--card:#0a0a0a;--text:#f2f2f2;--text2:#8a8a8a;--border:#262626;--gold:#e0b64a;}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
a{color:inherit;}
.app{max-width:620px;margin:0 auto;border-left:1px solid var(--border);border-right:1px solid var(--border);min-height:100vh;}
.topbar{position:sticky;top:0;background:rgba(0,0,0,0.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);padding:16px;text-align:center;z-index:10;}
.topbar h1{margin:0;font-size:18px;font-weight:700;}
.topbar p{margin:4px 0 0;font-size:12px;color:var(--text2);}
.composer{display:flex;gap:12px;padding:16px;border-bottom:1px solid var(--border);align-items:center;}
.avatar{width:40px;height:40px;border-radius:50%;background:#2c2c2c;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex-shrink:0;overflow:hidden;}
.avatar img{width:100%;height:100%;object-fit:cover;display:block;}
.composer-body{flex:1;}
.composer-prompt{margin:0 0 10px;color:var(--text2);font-size:15px;}
.btn-propose{display:inline-block;background:#fff;color:#000;font-weight:600;font-size:14px;padding:9px 18px;border-radius:20px;text-decoration:none;}
.tabs{display:flex;border-bottom:1px solid var(--border);}
.tab{flex:1;background:none;border:none;color:var(--text2);padding:14px;font-size:14px;font-weight:600;cursor:pointer;border-bottom:2px solid transparent;font-family:inherit;}
.tab.active{color:var(--text);border-bottom-color:var(--text);}
.type-filter{display:flex;flex-wrap:wrap;gap:8px;padding:10px 16px;border-bottom:1px solid var(--border);}
.type-filter button{background:none;border:1px solid var(--border);color:var(--text2);border-radius:14px;padding:6px 14px;font-size:13px;cursor:pointer;font-family:inherit;}
.type-filter button.active{background:#fff;color:#000;border-color:#fff;}
.seen-filter{padding:8px 16px;border-bottom:1px solid var(--border);}
.seen-filter button{background:none;border:1px solid var(--border);color:var(--text2);border-radius:14px;padding:6px 14px;font-size:12px;cursor:pointer;font-family:inherit;}
.seen-filter button.active{background:var(--gold);color:#000;border-color:var(--gold);}
.seen-toggle{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text2);margin:8px 0 0;cursor:pointer;}
.seen-toggle input{cursor:pointer;}
.feed{display:block;}
.post{display:flex;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border);}
.post-main{flex:1;min-width:0;}
.post-head{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;}
.handle{font-weight:600;font-size:14px;}
.meta{color:var(--text2);font-size:12px;}
.tag{font-size:10px;background:#1c1c1c;color:#9a9a9a;padding:2px 8px;border-radius:10px;margin-left:auto;white-space:nowrap;}
.post-body{margin:4px 0 8px;font-size:14px;line-height:1.45;color:var(--text2);white-space:pre-wrap;overflow-wrap:anywhere;}
.movie-card{display:flex;gap:10px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:8px;margin-top:2px;text-decoration:none;}
.poster{width:156px;height:228px;border-radius:6px;background:#1c1c1c;flex-shrink:0;object-fit:cover;display:flex;align-items:center;justify-content:center;font-size:16px;color:#555;}
.movie-info{flex:1;min-width:0;}
.movie-title{font-weight:600;font-size:14px;margin:0;color:var(--text);}
.movie-rating{font-size:12px;color:var(--gold);margin-top:3px;}
.movie-cast{font-size:11px;color:var(--text2);margin-top:2px;}
.actions{display:flex;gap:22px;margin-top:10px;color:var(--text2);}
.actions svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;display:block;}
.icon-btn{display:flex;align-items:center;gap:5px;background:none;border:none;color:var(--text2);cursor:pointer;font-family:inherit;padding:0;font-size:12px;}
.icon-btn.icon-static{cursor:default;}
.icon-count{font-size:12px;line-height:1;}
.like-btn:hover:not(:disabled){color:#f43f5e;}
.like-btn.liked{color:#f43f5e;}
.like-btn.liked svg{fill:#f43f5e;stroke:#f43f5e;}
.like-btn:disabled{opacity:.6;cursor:default;}
.watch-links{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
.watch-links a,.rate-link{font-size:12px;border:1px solid var(--border);border-radius:14px;padding:4px 10px;color:var(--text2);text-decoration:none;}
.watch-links a:hover,.rate-link:hover{border-color:#444;color:var(--text);}
.community-rating{color:var(--gold);}
.comments{margin-top:10px;border-top:1px solid var(--border);padding-top:8px;}
.comment{font-size:13px;color:var(--text2);margin:0 0 6px;line-height:1.4;}
.comment-handle{font-weight:600;color:var(--text);margin-right:4px;}
.comment{margin-bottom:10px;}
.comment-body{margin:2px 0 4px;}
.reply-list{margin:0 0 4px 14px;border-left:2px solid var(--border);padding-left:10px;}
.reply-item{font-size:12px;color:var(--text2);margin:0 0 4px;line-height:1.4;}
.reply-toggle{background:none;border:none;color:var(--text2);font-size:12px;cursor:pointer;font-family:inherit;padding:0;margin-left:0;}
.reply-toggle:hover{color:var(--text);text-decoration:underline;}.show-replies-toggle{background:none;border:none;color:var(--gold);font-size:12px;cursor:pointer;font-family:inherit;padding:0;margin:0 0 4px;display:block;}.show-replies-toggle:hover{text-decoration:underline;}
.reply-form{margin:8px 0 0 14px;max-width:320px;}
.reply-form .modal-input,.reply-form .modal-textarea{margin-bottom:6px;font-size:13px;}
.reply-form .modal-textarea{min-height:50px;}
.reply-form-actions{display:flex;}
.reply-form .reply-submit{padding:6px 12px;font-size:13px;}
.reply-hint{margin:6px 0 0;font-size:11px;color:var(--text2);}
.empty-state{padding:28px 16px;text-align:center;color:var(--text2);font-size:13px;line-height:1.6;}
.footer{padding:20px 16px;text-align:center;font-size:12px;color:var(--text2);}
.footer a{text-decoration:underline;}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.75);display:none;align-items:center;justify-content:center;z-index:200;padding:16px;}
.modal-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;width:100%;max-width:380px;}
.modal-title{margin:0 0 14px;font-size:16px;font-weight:700;color:var(--text);}
.modal-label{display:block;font-size:12px;color:var(--text2);margin:10px 0 4px;}
.modal-input,.modal-textarea{width:100%;background:#111;border:1px solid var(--border);border-radius:8px;color:var(--text);padding:8px 10px;font-size:14px;font-family:inherit;box-sizing:border-box;}
.modal-textarea{min-height:80px;resize:vertical;}
.modal-actions{display:flex;gap:10px;margin-top:16px;}
.modal-btn-secondary,.modal-btn-primary{flex:1;border-radius:20px;padding:9px 14px;font-size:14px;font-weight:600;cursor:pointer;border:1px solid var(--border);font-family:inherit;}
.modal-btn-secondary{background:none;color:var(--text2);}
.modal-btn-primary{background:#fff;color:#000;border-color:#fff;}
.modal-hint{margin:12px 0 0;font-size:11px;color:var(--text2);text-align:center;}
.propose-preview-loading{display:none;margin-top:10px;font-size:11px;color:var(--text2);}
.propose-preview-loading.active{display:block;}
.propose-preview{display:none;margin-top:10px;gap:10px;padding:10px;background:#111;border:1px solid var(--border);border-radius:10px;}
.propose-preview.active{display:flex;}
.propose-preview img{width:56px;height:84px;object-fit:cover;border-radius:6px;flex-shrink:0;background:#222;}
.propose-preview-info{flex:1;min-width:0;}
.propose-preview-title{font-size:13px;font-weight:600;color:var(--text);margin:0 0 2px;}
.propose-preview-meta{font-size:11px;color:var(--text2);margin:0 0 4px;}
.propose-preview-desc{font-size:11px;color:var(--text2);margin:0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
button.rate-link{background:none;font-family:inherit;cursor:pointer;}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <h1>Тредчани кіно</h1>
    <p>Національний перелік улюблених фільмів і серіалів</p>
  </header>
  <main>
    <section class="composer">
      <div class="avatar">OF</div>
      <div class="composer-body">
        <p class="composer-prompt">Яке твоє улюблене кіно і чому?</p>
        <a id="proposeBtn" class="btn-propose" href="#">Запропонувати фільм</a>
      </div>
    </section>
    <div class="tabs">
      <button class="tab active" data-tab="official">Рейтинг тредчана</button>
      <button class="tab" data-tab="community">Пропозиції спільноти</button>
    </div>
    <div class="type-filter">
      <button class="active" data-filter="all">Усі</button>
      <button data-filter="фільм">Фільми</button>
      <button data-filter="серіал">Серіали</button>
      <button data-filter="на подумать">На подумать</button>
      <button data-filter="екшон">Екшон</button>
      <button data-filter="хаха">Хаха</button>
      <button data-filter="псіхо">Псіхо</button>
      <button data-filter="епічно">Епічно</button>
      <button data-filter="мелодрама">Мелодрама</button>
      <button data-filter="культове">Культове</button>
    </div>
    <div class="seen-filter">
      <button type="button" id="seenFilterToggle" class="active">Приховати переглянуте</button>
      <button type="button" id="onlySeenToggle">Я дивився</button>
    </div>
    <section id="feed-official" class="feed"></section>
    <section id="feed-community" class="feed" style="display:none">
      <p class="empty-state">Завантажую пропозиції з GitHub…</p>
    </section>
  </main>
  <div class="footer">
    Список веде <a href="https://github.com/olegforbiz" target="_blank" rel="noopener">@olegforbiz</a> ·
    <a id="repoLink" href="#" target="_blank" rel="noopener">сирці на GitHub</a> ·
    афіші через Wikipedia
  </div>
</div>
<div id="rateModalOverlay" class="modal-overlay">
  <div class="modal-card">
    <h3 id="rateModalTitle" class="modal-title"></h3>
    <label class="modal-label">Твоє ім'я</label>
    <input type="text" id="rateModalName" class="modal-input" placeholder="напр. Олег">
    <label class="modal-label">Оцінка (1-10)</label>
    <input type="number" id="rateModalRating" class="modal-input" min="1" max="10" placeholder="напр. 8">
    <label class="modal-label">Коментар</label>
    <textarea id="rateModalComment" class="modal-textarea" placeholder="Чому саме така оцінка?"></textarea>
    <div class="modal-actions">
      <button type="button" id="rateModalCancel" class="modal-btn-secondary">Скасувати</button>
      <button type="button" id="rateModalSubmit" class="modal-btn-primary">Надіслати</button>
    </div>
    <p class="modal-hint" id="rateModalHint"></p>
  </div>
</div>
<div id="proposeModalOverlay" class="modal-overlay">
  <div class="modal-card">
    <h3 class="modal-title">Запропонувати фільм</h3>
    <label class="modal-label">Твоє ім'я</label>
    <input type="text" id="proposeModalName" class="modal-input" placeholder="напр. Олег">
    <label class="modal-label">Назва фільму або серіалу</label>
    <input type="text" id="proposeModalTitle" class="modal-input" placeholder="напр. Interstellar">
    <p class="propose-preview-loading" id="proposePreviewLoading">Шукаємо…</p>
    <div class="propose-preview" id="proposePreview">
      <img id="proposePreviewImg" src="" alt="">
      <div class="propose-preview-info">
        <p class="propose-preview-title" id="proposePreviewTitle"></p>
        <p class="propose-preview-meta" id="proposePreviewMeta"></p>
        <p class="propose-preview-desc" id="proposePreviewDesc"></p>
      </div>
    </div>
    <label class="modal-label">Чому раджу</label>
    <textarea id="proposeModalComment" class="modal-textarea" placeholder="Коротко, чому варто подивитись"></textarea>
    <div class="modal-actions">
      <button type="button" id="proposeModalCancel" class="modal-btn-secondary">Скасувати</button>
      <button type="button" id="proposeModalSubmit" class="modal-btn-primary">Надіслати</button>
    </div>
    <p class="modal-hint" id="proposeModalHint"></p>
  </div>
</div>
<script>
const REPO = "olegforbiz/tredchan-films";
document.getElementById("repoLink").href = "https://github.com/" + REPO;

const SEED = [
{t:"Breaking Bad",mood:"культове",y:"2008",type:"серіал",rating:9.5,cat:"Рекомендація",cast:"Bryan Cranston, Aaron Paul, Anna Gunn",syn:"Вчитель хімії дізнається про невиліковний рак і починає варити метамфетамін, щоб забезпечити родину. Страх бідності й смерті поступово перетворює тиху людину на найнебезпечнішого злочинця міста.",wiki:"Breaking_Bad"},

{t:"Better Call Saul",mood:"на подумать",y:"2015",type:"серіал",rating:8.9,cat:"Рекомендація",cast:"Bob Odenkirk, Rhea Seehorn, Jonathan Banks",syn:"Приквел до Breaking Bad про адвоката, який усе життя в тіні успішного брата. Відчуття несправедливості й амбіція штовхають його до афер на межі закону.",wiki:"Better_Call_Saul"},
{t:"Succession",mood:"на подумать",y:"2018",type:"серіал",rating:8.8,cat:"Рекомендація",cast:"Brian Cox, Jeremy Strong, Sarah Snook",syn:"Старіючий магнат медіаімперії не може обрати спадкоємця серед власних дітей. Діти воюють за трон і водночас за батьківське визнання, якого ніколи не отримували.",wiki:"Succession_(TV_series)"},
{t:"Peaky Blinders",mood:"епічно",y:"2013",type:"серіал",rating:8.8,cat:"Рекомендація",cast:"Cillian Murphy, Paul Anderson, Sophie Rundle",syn:"Ветеран Першої світової з ПТСР перетворює вуличну банду Бірмінгема на легальну бізнес-імперію. Травма війни живить його холодний розрахунок і водночас руйнує особисте життя.",wiki:"Peaky_Blinders"},
{t:"Inception",mood:"епічно",y:"2010",type:"фільм",rating:8.8,cat:"Нолан (раніше виключено)",cast:"Leonardo DiCaprio, Joseph Gordon-Levitt, Elliot Page",syn:"Злодій, що краде ідеї уві сні, отримує шанс повернутися додому в обмін на імплантацію чужої думки. Провина за смерть дружини переслідує його на кожному рівні сну.",wiki:"Inception"},
{t:"Interstellar",mood:"епічно",y:"2014",type:"фільм",rating:8.7,cat:"Вже знаєш",cast:"Matthew McConaughey, Anne Hathaway, Jessica Chastain",syn:"Фермер-пілот залишає доньку заради польоту крізь червоточину в пошуках нового дому для людства.",wiki:"Interstellar_(film)"},
{t:"Se7en",mood:"псіхо",y:"1995",type:"фільм",rating:8.6,cat:"Бред Пітт (раніше виключено)",cast:"Brad Pitt, Morgan Freeman, Kevin Spacey",syn:"Два детективи ганяються за вбивцею, який карає жертв за сімома смертними гріхами. Молодий напарник поступово втрачає психологічну стійкість перед фіналом.",wiki:"Se7en"},

function timeAgo(dateStr){
  const diff = (Date.now() - new Date(dateStr).getTime())/1000;
  const units = [[31536000,"р."],[2592000,"міс."],[86400,"дн."],[3600,"год."],[60,"хв."]];
  for(const [s,l] of units){ if(diff>=s){ return Math.floor(diff/s)+" "+l+" тому"; } }
  return "щойно";
}

async function fetchPosterBySlug(slug){
  try{
    const res = await fetch("https://en.wikipedia.org/api/rest_v1/page/summary/"+slug);
    if(!res.ok) return null;
    const data = await res.json();
    return (data.originalimage && data.originalimage.source) || (data.thumbnail && data.thumbnail.source) || null;
  }catch(e){ return null; }
}

async function fetchPosterByTitle(title){
  try{
    const sRes = await fetch("https://en.wikipedia.org/w/api.php?action=query&list=search&format=json&origin=*&srlimit=1&srsearch="+encodeURIComponent(title+" film"));
    const sData = await sRes.json();
    const hit = sData.query && sData.query.search && sData.query.search[0];
    if(!hit) return null;
    return await fetchPosterBySlug(encodeURIComponent(hit.title.replace(/ /g,"_")));
  }catch(e){ return null; }
}


async function fetchPosterTVmaze(title){
  try{
    const res = await fetch("https://api.tvmaze.com/singlesearch/shows?q="+encodeURIComponent(title));
    if(!res.ok) return null;
    const data = await res.json();
    return (data.image && (data.image.original || data.image.medium)) || null;
  }catch(e){ return null; }
}

async function fetchPosterItunes(title, type){
  try{
    const isShow = type === "серіал";
    const media = isShow ? "tvShow" : "movie";
    const entity = isShow ? "tvSeason" : "movie";
    const res = await fetch("https://itunes.apple.com/search?term="+encodeURIComponent(title)+"&media="+media+"&entity="+entity+"&limit=1");
    if(!res.ok) return null;
    const data = await res.json();
    const hit = data.results && data.results[0];
    if(!hit || !hit.artworkUrl100) return null;
    return hit.artworkUrl100.replace("100x100bb","600x600bb");
  }catch(e){ return null; }
}

const RATE_WORKER_URL = "https://tredchan-films.oleg-forbiz.workers.dev";
document.getElementById("rateModalSubmit").addEventListener("click", async function(){
  const btn = this;
  const name = document.getElementById("rateModalName").value.trim() || "Тредчан";
  const rating = document.getElementById("rateModalRating").value.trim();
  const comment = document.getElementById("rateModalComment").value.trim();
  const hint = document.getElementById("rateModalHint");
  btn.disabled = true;
  btn.textContent = "Надсилаємо…";
  if(hint){ hint.textContent = ""; hint.style.color = ""; }
  try{
    const res = await fetch(RATE_WORKER_URL, {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ title: __rateModalTitle, name: name, rating: rating, comment: comment })
    });
    const data = await res.json();
    if(!res.ok || !data.success) throw new Error((data && data.error) || "Помилка");
    setMyName(name);
    if(hint){ hint.textContent = "Дякуємо! Оцінку додано."; hint.style.color = "#4ade80"; }

    if(hint){ hint.textContent = "Не вдалося надіслати. Спробуйте ще раз."; hint.style.color = "#f87171"; }
    btn.disabled = false;
    btn.textContent = "Надіслати";
  }
});

function parseRatingIssues(issues){
  const map = {};
  issues.forEach(issue=>{
    if(issue.pull_request) return;
    if(issue.title.indexOf("[Оцінка]")!==0) return;
    const movieTitle = issue.title.replace("[Оцінка]","").trim();
    const body = issue.body || "";
    const nameMatch = body.match(/Ім'я:\s*([^\n]*)/i);
    const name = (nameMatch && nameMatch[1].trim()) ? nameMatch[1].trim() : (issue.user && issue.user.login ? issue.user.login : "Тредчан");
    const ratingMatch = body.match(/Оцінка\s*\(1-10\):\s*(\d{1,2})/i);
    let rating = ratingMatch ? parseInt(ratingMatch[1],10) : null;
    if(rating!==null){ rating = Math.min(10, Math.max(1, rating)); }
    const commentMatch = body.match(/Коментар:\s*([\s\S]*)/i);
    const comment = commentMatch ? commentMatch[1].trim() : "";
    if(!map[movieTitle]) map[movieTitle] = [];
    map[movieTitle].push({
      number: issue.number,
      rating: rating,
      comment: comment,
      name: name,
      login: issue.user && issue.user.login ? issue.user.login : "анонім",
      replies: []
    });
  });
  return map;
}

function attachReplies(ratingsMap, comments){
  const byIssueNumber = {};
  Object.keys(ratingsMap).forEach(title=>{
    ratingsMap[title].forEach(entry=>{ byIssueNumber[entry.number] = entry; });
  });
  (comments||[]).forEach(c=>{
    const m = (c.issue_url||"").match(/\/issues\/(\d+)$/);
    if(!m) return;
    const entry = byIssueNumber[parseInt(m[1],10)];
    if(!entry) return;
    const body = c.body || "";
    const nameMatch = body.match(/^Ім'я:\s*([^\n]*)/i);
    const name = (nameMatch && nameMatch[1].trim()) ? nameMatch[1].trim() : (c.user && c.user.login ? c.user.login : "Тредчан");
    let text = body;
    if(nameMatch){ text = body.slice(nameMatch[0].length).replace(/^\n+/,"").trim(); }
    if(!text) return;
    entry.replies.push({ name: name, text: text, id: c.id });
  });
  return ratingsMap;
}

function parseLikeIssues(issues){
  const map = {};
  issues.forEach(issue=>{
    if(issue.pull_request) return;
    if(issue.title.indexOf("[Лайк]")!==0) return;
    const movieTitle = issue.title.replace("[Лайк]","").trim();
    if(!map[movieTitle]) map[movieTitle] = [];
    map[movieTitle].push({ number: issue.number, state: issue.state });
  });
  return map;
}
function parseSeenIssues(issues){
  const map = {};
  issues.forEach(function(issue){
    if(issue.pull_request) return;
    if(issue.title.indexOf("[Переглянуто]")!==0) return;
    const movieTitle = issue.title.replace("[Переглянуто]","").trim();
    const body = issue.body || "";
    const nameMatch = body.match(/Ім'я:\s*([^\n]*)/i);
    const name = nameMatch ? nameMatch[1].trim() : "";
    if(!map[movieTitle]) map[movieTitle] = [];
    map[movieTitle].push({ number: issue.number, state: issue.state, name: name });
  });
  return map;
}
function findMySeenEntry(seenEntries){
  const myName = getMyName().trim().toLowerCase();
  if(!myName) return null;
  return (seenEntries||[]).find(function(s){ return s.state === "open" && (s.name||"").trim().toLowerCase() === myName; }) || null;
}

}

    localStorage.setItem("myName", name);
  }catch(e){}
}
function getMyLikeNumber(title){
  try{
    const v = localStorage.getItem("like:"+title);
    return v ? parseInt(v,10) : null;
  }catch(e){ return null; }
}
function setMyLikeNumber(title, num){
  try{
    if(num===null) localStorage.removeItem("like:"+title);
    else localStorage.setItem("like:"+title, String(num));
  }catch(e){}
}
async function handleLikeClick(title, btn){
  if(btn.dataset.busy === "1") return;
  btn.dataset.busy = "1";
  btn.disabled = true;
  const countEl = btn.querySelector(".icon-count");
  const myNum = getMyLikeNumber(title);
  try{
    if(myNum){
      const res = await fetch(RATE_WORKER_URL, {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({ type: "unlike", title: title, issueNumber: myNum })
      });
      const data = await res.json();
      if(!res.ok || !data.success) throw new Error((data && data.error) || "Помилка");
      setMyLikeNumber(title, null);
      btn.classList.remove("liked");
      if(countEl) countEl.textContent = Math.max(0, (parseInt(countEl.textContent,10)||1) - 1);
    } else {
      const res = await fetch(RATE_WORKER_URL, {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({ type: "like", title: title })
      });
      const data = await res.json();
      if(!res.ok || !data.success) throw new Error((data && data.error) || "Помилка");
      setMyLikeNumber(title, data.issueNumber);
      btn.classList.add("liked");
      if(countEl) countEl.textContent = (parseInt(countEl.textContent,10)||0) + 1;
    }
  }catch(err){
    console.error("like error", err);
  }finally{
    btn.dataset.busy = "0";
    btn.disabled = false;
  }
}

async function handleSeenToggle(title, checkbox){
  if(checkbox.dataset.busy === "1") return;
  const wantSeen = checkbox.checked;
  checkbox.dataset.busy = "1";
  checkbox.disabled = true;
  try{
    if(wantSeen){
      const name = getMyName().trim();
      if(!name){
        checkbox.checked = false;
        alert("Спочатку вкажи своє ім'я — постав оцінку чи зроби пропозицію хоч раз, і воно запам'ятається.");
        return;
      }
      const res = await fetch(RATE_WORKER_URL, {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({ type: "seen", title: title, name: name })
      });
      const data = await res.json();
      if(!res.ok || !data.success) throw new Error((data && data.error) || "Помилка");
      if(!lastSeenMap[title]) lastSeenMap[title] = [];
      lastSeenMap[title].push({ number: data.issueNumber, state: "open", name: name });
      if(hideSeen){ renderOfficial(lastRatingsMap); return; }
    } else {
      const entry = findMySeenEntry(lastSeenMap[title] || []);
      if(entry){
        const res = await fetch(RATE_WORKER_URL, {
          method: "POST",
          headers: {"Content-Type":"application/json"},
          body: JSON.stringify({ type: "unseen", title: title, issueNumber: entry.number })
        });
        const data = await res.json();
        if(!res.ok || !data.success) throw new Error((data && data.error) || "Помилка");
        entry.state = "closed";
      }
    }
  }catch(err){
    checkbox.checked = !wantSeen;
    console.error("seen error", err);
  }finally{
    checkbox.dataset.busy = "0";
    checkbox.disabled = false;
  }
}

function parseProposeBody(body){
  body = body || "";
  const otM = body.match(/Оригінальна назва:\s*([^\n]*)/);
  const yearM = body.match(/Рік:\s*([^\n]*)/);
  const posterM = body.match(/Постер:\s*([^\n]*)/);
  const descM = body.match(/Опис:\s*([\s\S]*?)\n\nКоментар тредчана:/);
  const commentM = body.match(/Коментар тредчана:\s*([\s\S]*)/);
  return {
    originalTitle: otM ? otM[1].trim() : "",
    year: yearM ? yearM[1].trim() : "",
    poster: posterM ? posterM[1].trim() : "",
    description: descM ? descM[1].trim() : "",
    comment: commentM ? commentM[1].trim() : body
  };
}

async function hydratePosters(root){
  const posters = root.querySelectorAll(".poster[data-wiki], .poster[data-title]");
  for(const p of posters){
    const slug = p.getAttribute("data-wiki");
    const title = p.getAttribute("data-title");
    const type = p.getAttribute("data-type");
    let url = slug ? await fetchPosterBySlug(slug) : await fetchPosterByTitle(title);
    if(!url && title){
      url = (type === "серіал") ? await fetchPosterTVmaze(title) : await fetchPosterItunes(title, type);
      if(!url){
        url = (type === "серіал") ? await fetchPosterItunes(title, type) : await fetchPosterTVmaze(title);
      }
    }
    if(url){
      const img = document.createElement("img");
      img.src = url;
      img.alt = title;
      img.style.width = "100%";
      img.style.height = "100%";
      img.style.objectFit = "cover";
      img.style.borderRadius = "6px";
      p.textContent = "";
      p.appendChild(img);
    }
    await new Promise(r=>setTimeout(r,180));
  }
}

function renderOfficial(ratingsMap){
  lastRatingsMap = ratingsMap;
  const el = document.getElementById("feed-official");
  el.innerHTML = "";
  const typeValues = ["фільм","серіал"];
  let source = typeFilter === "all" ? SEED : SEED.filter(item=>item.type===typeFilter);
  if(moodFilter) source = source.filter(item=>item.mood===moodFilter);
  const scored = source.map(item=>{
    const ratings = ratingsMap[item.t] || [];
    const rated = ratings.filter(r=>r.rating!=null);
    const avgCommunity = rated.length ? (rated.reduce((s,r)=>s+r.rating,0)/rated.length) : null;
    const combined = avgCommunity!=null ? (item.rating+avgCommunity)/2 : item.rating;
    return {item, ratings, combined};
  });
  scored.sort((a,b)=>b.combined-a.combined);
  const isSeenEntry = (s) => !!findMySeenEntry(lastSeenMap[s.item.t] || []);
  let finalList;
  if(showOnlySeen){
    finalList = scored.filter(s=>isSeenEntry(s));
  } else if(hideSeen){
    finalList = scored.filter(s=>!isSeenEntry(s));
  } else {
    const notSeen = scored.filter(s=>!isSeenEntry(s));
    const seen = scored.filter(s=>isSeenEntry(s));
    finalList = notSeen.concat(seen);
  }
  if(finalList.length===0){
    el.innerHTML = showOnlySeen
      ? '<p class="empty-state">Ти ще нічого не позначив переглянутим.</p>'
      : (scored.length>0
        ? '<p class="empty-state">Усе з цього фільтра вже позначено переглянутим. Натисни «Приховати переглянуте», щоб побачити знову.</p>'
        : '<p class="empty-state">Нічого не знайдено для цього фільтра.</p>');
    return;
  }
  finalList.forEach(s=>el.appendChild(buildSeedPost(s.item, s.ratings, lastLikesMap[s.item.t] || [], lastSeenMap[s.item.t] || [])));
  hydratePosters(el);
}

function renderCommunity(issues, ok){
  const el = document.getElementById("feed-community");
  if(!ok){
    el.innerHTML = '<p class="empty-state">Не вдалось завантажити пропозиції з GitHub. Спробуй відкрити репозиторій напряму.</p>';
    return;
  }
  const subs = issues.filter(i=>!i.pull_request && i.title.indexOf("[Фільм]")===0);
  el.innerHTML = "";
  if(subs.length===0){
    el.innerHTML = '<p class="empty-state">Поки що пропозицій немає. Стань першим — тисни «Запропонувати фільм» вгорі.</p>';
    return;
  }
  subs.sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
  subs.forEach(issue=>{
    const title = issue.title.replace("[Фільм]","").trim();
    el.appendChild(buildCommunityPost(issue, title));
  });
  hydratePosters(el);
}

function extractYearFromText(text){
  if(!text) return "";
  const m = text.match(/(19|20)\d{2}/);
  return m ? m[0] : "";
}

async function fetchWikiMovieInfo(title, lang){
  try{
    const searchUrl = "https://"+lang+".wikipedia.org/w/api.php?action=query&list=search&format=json&origin=*&srlimit=5&srsearch="+encodeURIComponent(title);
    const sRes = await fetch(searchUrl);
    const sData = await sRes.json();
    const hits = (sData.query && sData.query.search) || [];
    if(!hits.length) return null;
    const mediaRe = lang === "uk"
      ? /фільм|серіал|стрічка|кінофільм|мультфільм|аніме|мультсеріал/i
      : /\bfilm\b|\bmovie\b|tv series|television series|\banime\b/i;
    let chosenTitle = null, chosenSum = null, fallbackTitle = null, fallbackSum = null;
    for(const hit of hits){
      const slug = encodeURIComponent(hit.title.replace(/ /g,"_"));
      try{
        const sumRes = await fetch("https://"+lang+".wikipedia.org/api/rest_v1/page/summary/"+slug);
        if(!sumRes.ok) continue;
        const sum = await sumRes.json();
        if(!fallbackTitle){ fallbackTitle = hit.title; fallbackSum = sum; }
        if(sum.description && mediaRe.test(sum.description)){
          chosenTitle = hit.title; chosenSum = sum; break;
        }
      }catch(e){}
    }
    if(!chosenTitle && fallbackTitle){ chosenTitle = fallbackTitle; chosenSum = fallbackSum; }
    if(!chosenTitle) return null;
    const pageTitle = chosenTitle;
    const sum = chosenSum;
    const poster = (sum.originalimage && sum.originalimage.source) || (sum.thumbnail && sum.thumbnail.source) || "";
    const description = sum.extract || "";
    const year = extractYearFromText(sum.description) || extractYearFromText(description);
    let originalTitle = "";
    if(lang === "uk"){
      try{
        const llRes = await fetch("https://uk.wikipedia.org/w/api.php?action=query&prop=langlinks&lllang=en&format=json&origin=*&titles="+encodeURIComponent(pageTitle));
        const llData = await llRes.json();
        const pages = llData.query && llData.query.pages;
        if(pages){
          const page = pages[Object.keys(pages)[0]];
          if(page && page.langlinks && page.langlinks[0]) originalTitle = (page.langlinks[0]["*"] || "").replace(/\s*\([^)]*\)\s*$/, "");
        }
      }catch(e){}
    } else {
      originalTitle = pageTitle;
    }
    return { poster: poster, description: description, year: year, originalTitle: (originalTitle || pageTitle), pageTitle: pageTitle, lang: lang };
  }catch(e){ return null; }
}

async function searchMovieInfo(title){
  let info = await fetchWikiMovieInfo(title, "uk");
  if(!info) info = await fetchWikiMovieInfo(title, "en");
  if(!info) return null;
  if(!info.poster){
    info.poster = (await fetchPosterTVmaze(title)) || (await fetchPosterItunes(title, "фільм")) || "";
  }
  return info;
}

  document.getElementById("proposeModalName").value = getMyName();
  document.getElementById("proposeModalTitle").value = "";
  document.getElementById("proposeModalComment").value = "";
  const hint = document.getElementById("proposeModalHint");
  if(hint){ hint.textContent = ""; hint.style.color = ""; }
  const submitBtn = document.getElementById("proposeModalSubmit");
  if(submitBtn){ submitBtn.disabled = false; submitBtn.textContent = "Надіслати"; }
  proposeSearchResult = null;
  if(proposeSearchTimer) clearTimeout(proposeSearchTimer);
  const preview0 = document.getElementById("proposePreview");
  if(preview0) preview0.classList.remove("active");
  const loading0 = document.getElementById("proposePreviewLoading");
  if(loading0) loading0.classList.remove("active");
  document.getElementById("proposeModalOverlay").style.display = "flex";
}
function closeProposeModal(){
  document.getElementById("proposeModalOverlay").style.display = "none";
}
document.getElementById("proposeModalCancel").addEventListener("click", closeProposeModal);
document.getElementById("proposeModalOverlay").addEventListener("click", function(e){ if(e.target.id === "proposeModalOverlay") closeProposeModal(); });
document.getElementById("proposeModalTitle").addEventListener("input", function(){
  const title = this.value.trim();
  if(proposeSearchTimer) clearTimeout(proposeSearchTimer);
  proposeSearchResult = null;
  const preview = document.getElementById("proposePreview");
  if(preview) preview.classList.remove("active");
  const loading = document.getElementById("proposePreviewLoading");
  if(!title){
    if(loading) loading.classList.remove("active");
    return;
  }
  if(loading) loading.classList.add("active");
  proposeSearchTimer = setTimeout(async function(){
    const info = await searchMovieInfo(title);
    proposeSearchResult = info;
    renderProposePreview(info);
  }, 700);
});
document.getElementById("proposeModalSubmit").addEventListener("click", async function(){
  const btn = this;
  const name = document.getElementById("proposeModalName").value.trim() || "Тредчан";
  const title = document.getElementById("proposeModalTitle").value.trim();
  const comment = document.getElementById("proposeModalComment").value.trim();
  const hint = document.getElementById("proposeModalHint");
  if(hint){ hint.textContent = ""; hint.style.color = ""; }
  if(!title){
    if(hint){ hint.textContent = "Вкажи назву фільму чи серіалу."; hint.style.color = "#f87171"; }
    return;
  }
  btn.disabled = true;
  btn.textContent = "Надсилаємо…";
  try{
    const res = await fetch(RATE_WORKER_URL, {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({
        type: "propose", title: title, name: name, comment: comment,
        year: (proposeSearchResult && proposeSearchResult.year) || "",
        originalTitle: (proposeSearchResult && proposeSearchResult.originalTitle) || "",
        description: (proposeSearchResult && proposeSearchResult.description) || "",
        poster: (proposeSearchResult && proposeSearchResult.poster) || ""
      })
    });
    const data = await res.json();
    if(!res.ok || !data.success) throw new Error((data && data.error) || "Помилка");
    setMyName(name);
    if(hint){ hint.textContent = "Дякуємо! Пропозицію додано."; hint.style.color = "#4ade80"; }
    btn.textContent = "Надіслано";
    setTimeout(closeProposeModal, 1200);
  }catch(err){
    if(hint){ hint.textContent = "Не вдалося надіслати. Спробуйте ще раз."; hint.style.color = "#f87171"; }
    btn.disabled = false;
    btn.textContent = "Надіслати";
  }
});

async function init(){
  let issues = [];
  let ok = false;
  try{
    const res = await fetch("https://api.github.com/repos/"+REPO+"/issues?state=all&per_page=100");
    if(res.ok){ issues = await res.json(); ok = true; }
  }catch(e){}
  let comments = [];
  try{
    const cres = await fetch("https://api.github.com/repos/"+REPO+"/issues/comments?per_page=100");
    if(cres.ok){ comments = await cres.json(); }
  }catch(e){}
  const ratingsMap = parseRatingIssues(issues);
  attachReplies(ratingsMap, comments);
  lastLikesMap = parseLikeIssues(issues);
  lastSeenMap = parseSeenIssues(issues);
  renderOfficial(ratingsMap);
  renderCommunity(issues, ok);
}
init();
</script>
